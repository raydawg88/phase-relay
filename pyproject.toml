[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-relay"
version = "0.1.2"
description = "Adaptive model routing for whole projects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ray Hernandez"}]
keywords = ["ai", "agents", "llm", "model-routing", "codex", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
phase-relay = "phaserelay.cli:main"

[tool.setuptools.package-data]
phaserelay = ["defaults/*.json", "defaults/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
